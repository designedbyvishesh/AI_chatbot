<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recording & Timer Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  
  <!-- Recording Timer Widget CSS -->
  <link rel="stylesheet" href="recording-timer.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0c0d10;
      color: #f0f2f5;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .demo-container {
      width: 680px;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <!-- Widget Container Target -->
  <div class="demo-container">
    <div id="recorder-container"></div>
  </div>

  <!-- Include RecordingTimer JS Script -->
  <script src="recording-timer.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize the RecordingTimer component
      const recorder = new RecordingTimer('#recorder-container', {
        onSave: (payload) => {
          console.log('Saved Recording Payload:', payload);
        }
      });
    });
  </script>
</body>
</html>
