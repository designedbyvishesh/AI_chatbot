<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Agile Whiteboard Session — Interactive Design System & UX Architecture AI Tutor with real-time audio recording and AI workspace." />
  <title>Agile Whiteboard — Interaction & Design System AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="recording-timer.css" />
  <link rel="stylesheet" href="agile.css" />
</head>

<body>
  <div class="app-shell" id="app-shell">
    <!-- ═══════ TOP BAR ═══════ -->
    <header class="topbar" id="topbar">
      <div class="topbar__left">
        <div class="topbar__logo" id="logo" title="Design System AI Engine">
          <svg width="28" height="24" viewBox="0 0 28 24" fill="none">
            <rect x="2" y="4" width="8" height="16" rx="2" fill="#4CAF50" />
            <rect x="12" y="8" width="6" height="12" rx="2" fill="#66BB6A" />
            <rect x="20" y="2" width="6" height="18" rx="2" fill="#81C784" />
          </svg>
        </div>
        <button class="topbar__icon-btn" id="menu-btn" aria-label="Open sidebar" title="Chat History & Topics">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <!-- ═══ Mode Switcher (Quiz / Agile) ═══ -->
        <div class="mode-switcher" id="mode-switcher" title="Switch between Quiz & Agile modes">
          <div class="mode-switcher__active mode-switcher__active--agile" id="mode-switcher-trigger">
            <span class="mode-switcher__icon">
              <span class="material-symbols-outlined" style="font-size: 16px;">bolt</span>
            </span>
            <span class="mode-switcher__label" id="mode-switcher-label">Agile</span>
          </div>
          <div class="mode-switcher__controls">
            <span class="material-symbols-outlined mode-switcher__dots">more_vert</span>
            <span class="material-symbols-outlined mode-switcher__clock">schedule</span>
          </div>
          <!-- Dropdown -->
          <div class="mode-switcher__dropdown" id="mode-switcher-dropdown">
            <button class="mode-switcher__option" id="mode-opt-quiz" data-mode="quiz">
              <span class="mode-switcher__opt-icon">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="1" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
                  <text x="8" y="11.5" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">?</text>
                </svg>
              </span>
              <span class="mode-switcher__opt-label">Default Quiz Version</span>
              <span class="material-symbols-outlined mode-switcher__opt-check">check</span>
            </button>
            <button class="mode-switcher__option mode-switcher__option--active" id="mode-opt-agile" data-mode="agile">
              <span class="mode-switcher__opt-icon">
                <span class="material-symbols-outlined" style="font-size: 14px;">bolt</span>
              </span>
              <span class="mode-switcher__opt-label">Agile</span>
              <span class="material-symbols-outlined mode-switcher__opt-check">check</span>
            </button>
          </div>
        </div>
      </div>
      <div class="topbar__right">
        <span class="topbar__time" id="current-time">07:00 AM</span>
        <button class="topbar__icon-btn topbar__star" id="settings-trigger-btn" aria-label="AI Engine Settings"
          title="AI Provider & Settings">
          <span class="material-symbols-outlined">kid_star</span>
        </button>
        <button class="topbar__icon-btn" id="more-btn" aria-label="More options" title="Page Options">
          <span class="material-symbols-outlined">more_horiz</span>
        </button>
      </div>
    </header>

    <!-- ═══════ OVERLAY BACKDROP ═══════ -->
    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <!-- ═══════ LEFT SIDEBAR ═══════ -->
    <aside class="sidebar" id="sidebar" aria-label="Chat sidebar">
      <!-- Header -->
      <div class="sidebar__header">
        <div class="sidebar__logo">
          <svg width="31" height="27" viewBox="0 0 31 27" fill="none">
            <rect x="2" y="4" width="9" height="19" rx="2" fill="#4CAF50" />
            <rect x="13" y="8" width="7" height="14" rx="2" fill="#66BB6A" />
            <rect x="22" y="2" width="7" height="21" rx="2" fill="#81C784" />
          </svg>
        </div>
        <button class="sidebar__close-btn" id="sidebar-close-btn" aria-label="Close sidebar">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Tabs -->
      <div class="sidebar__tabs">
        <button class="sidebar__tab sidebar__tab--active" id="tab-all-chats">All Sessions</button>
        <button class="sidebar__tab" id="tab-favorites">
          <span class="material-symbols-outlined sidebar__tab-icon">kid_star</span>
          <span>Starred</span>
        </button>
      </div>

      <!-- Chat History / Modules -->
      <div class="sidebar__history" id="sidebar-history">
        <div class="sidebar__history-section" id="user-history-section">
          <div class="sidebar__section-header">
            <span class="material-symbols-outlined sidebar__section-icon">history</span>
            <span class="sidebar__section-title">Agile Session History</span>
          </div>
          <div class="sidebar__session-list" id="user-session-list">
            <!-- Dynamically populated by agile-session.js -->
          </div>
        </div>
      </div>
    </aside>

    <!-- ═══════ MAIN CONTENT: FLOATING AGILE WHITEBOARD ═══════ -->
    <main class="agile-workspace" id="agile-workspace">
      <!-- Dark Wallpaper Ambient Background -->
      <div class="agile-wallpaper-bg" aria-hidden="true"></div>

      <!-- ─── FLOATING LEFT CARD CONTAINER ─── -->
      <div class="agile-floating-panel" id="agile-floating-panel">
        <!-- Session Title Header (W1 ✎) -->
        <div class="session-title-header">
          <div class="session-title-header__left">
            <h2 class="session-title-header__name" id="session-title" contenteditable="true" spellcheck="false">W1</h2>
            <button class="session-title-header__edit-btn" id="edit-title-btn" aria-label="Edit title" title="Edit session title">
              <span class="material-symbols-outlined">edit</span>
            </button>
          </div>
          <button class="session-title-header__save-btn" id="save-session-btn" title="Save session to history">Save</button>
        </div>

        <!-- Section 1: Lessons from last -->
        <div class="agile-section">
          <div class="agile-section__label">Lessons from last:</div>
          <div class="agile-inner-card agile-inner-card--lessons">
            <ul class="agile-bullet-list">
              <li>Say the words clearly</li>
              <li>Take pauses over fillers works</li>
              <li>Finish first sentence then go to another</li>
            </ul>
          </div>
        </div>

        <!-- Section 2: Timer & Recorder -->
        <div class="agile-section">
          <div class="agile-section__label">Timer & Recorder</div>
          <div class="agile-inner-card agile-inner-card--recorder">
            <div id="agile-recorder-container"></div>
          </div>
        </div>

        <!-- Section 3: Take notes -->
        <div class="agile-section agile-section--notes">
          <div class="agile-section__label">Take notes:</div>
          <div class="agile-inner-card agile-inner-card--notes">
            <textarea class="agile-notes-input" id="agile-notes-input" placeholder=""></textarea>
          </div>
        </div>
      </div>

      <!-- ─── RIGHT CANVAS AREA & FLOATING PROMPT BAR ─── -->
      <div class="agile-canvas-space" id="agile-canvas-space">
        <!-- Floating Prompt Input Bar at Bottom Right -->
        <div class="agile-prompt-wrapper">
          <div class="agile-prompt-bar">
            <input type="text" class="agile-prompt-input" id="agile-prompt-input" placeholder="Have any question? do ask" autocomplete="off" />
            <button class="agile-prompt-send-btn" id="agile-prompt-send-btn" aria-label="Send prompt">
              <span class="material-symbols-outlined">send</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Include RecordingTimer JS Script & Agile Session Manager -->
  <script src="recording-timer.js"></script>
  <script src="agile-session.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initClock();
      initModeSwitcher();
      initRecorderWidget();
      initEditableTitle();
      initPromptInput();
    });

    /* ── Live Clock ── */
    function initClock() {
      const timeEl = document.getElementById('current-time');
      if (!timeEl) return;
      function update() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        timeEl.textContent = `${hours.toString().padStart(2, '0')}:${minutes} ${ampm}`;
      }
      update();
      setInterval(update, 30000);
    }

    /* ── Mode Switcher ── */
    function initModeSwitcher() {
      const switcher = document.getElementById('mode-switcher');
      const dropdown = document.getElementById('mode-switcher-dropdown');
      const quizOpt = document.getElementById('mode-opt-quiz');
      const agileOpt = document.getElementById('mode-opt-agile');

      if (!switcher || !dropdown) return;

      switcher.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('mode-switcher__dropdown--open');
      });

      if (quizOpt) {
        quizOpt.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdown.classList.remove('mode-switcher__dropdown--open');
          window.location.href = 'index.html';
        });
      }

      document.addEventListener('click', (e) => {
        if (!switcher.contains(e.target)) dropdown.classList.remove('mode-switcher__dropdown--open');
      });
    }

    /* ── Initialize RecordingTimer Widget ── */
    function initRecorderWidget() {
      window.AgileRecorderInstance = new RecordingTimer('#agile-recorder-container', {
        onSave: (payload) => {
          console.log('Agile Whiteboard Audio Saved:', payload);
        }
      });
    }

    /* ── Editable Session Title ── */
    function initEditableTitle() {
      const titleEl = document.getElementById('session-title');
      const editBtn = document.getElementById('edit-title-btn');
      if (editBtn && titleEl) {
        editBtn.addEventListener('click', () => {
          titleEl.focus();
        });
      }
    }

    /* ── Prompt Input Button Active State ── */
    function initPromptInput() {
      const input = document.getElementById('agile-prompt-input');
      const sendBtn = document.getElementById('agile-prompt-send-btn');
      if (!input || !sendBtn) return;

      function update() {
        if (input.value.trim().length > 0) {
          sendBtn.classList.add('is-active');
        } else {
          sendBtn.classList.remove('is-active');
        }
      }

      input.addEventListener('input', update);
      update();
    }
  </script>
</body>

</html>
