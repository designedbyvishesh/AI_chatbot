<!DOCTYPE html>
<html lang="en" style="background:#000">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rabbit Quiz mode is coming soon." />
  <title>Quiz — Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="agile.css" />
  <style>
    html, body { background: #000 !important; }
    body { margin: 0; min-height: 100vh; overflow: hidden; }

    .soon-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 44px;
      padding: 0 20px;
      z-index: 2;
    }
    .soon-topbar__logo { display: inline-flex; }
    .soon-topbar__logo img { width: 32px; height: 32px; display: block; }

    .soon {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 16px;
      text-align: center;
    }
    .soon__bunny {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: soonFloat 3.2s ease-in-out infinite;
    }
    .soon__title {
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      color: #fff;
      margin: 0;
      letter-spacing: -0.3px;
    }
    .soon__text {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.55);
      margin: 0;
      max-width: 320px;
      line-height: 1.5;
    }
    @keyframes soonFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .soon__bunny { animation: none; }
    }
  </style>
</head>

<body>
  <!-- Same popping-rabbit loader as Agile mode, so switching never shows a blank screen -->
  <div id="agile-home-page-loader" class="agile-home-loader">
    <div class="agile-bunny-loader agile-bunny-loader--lg">
      <img src="assets/hidden_Bunny_SVG.svg" class="agile-bunny-loader__img" alt="Loading..." />
    </div>
  </div>

  <header class="soon-topbar">
    <a class="soon-topbar__logo" href="agile.html" title="Rabbit">
      <img src="assets/Logo_Black_BG.svg" alt="Rabbit" />
    </a>
    <div class="mode-switcher" id="mode-switcher" data-active-mode="quiz" title="Switch between Quiz & Agile modes">
      <div class="mode-switcher__slider"></div>
      <button class="mode-switcher__item mode-switcher__item--quiz" id="mode-opt-quiz" data-mode="quiz"
        aria-label="Quiz mode">
        <span class="mode-switcher__item-icon">
          <span class="material-symbols-outlined">quiz</span>
        </span>
        <span class="mode-switcher__item-text">Quiz</span>
      </button>
      <button class="mode-switcher__item mode-switcher__item--agile" id="mode-opt-agile" data-mode="agile"
        aria-label="Switch to Agile mode">
        <span class="mode-switcher__item-icon">
          <span class="material-symbols-outlined">bolt</span>
        </span>
        <span class="mode-switcher__item-text">Agile</span>
      </button>
    </div>
  </header>

  <main class="soon">
    <img src="assets/Bunny_Blink_animation.svg" alt="" class="soon__bunny" />
    <h1 class="soon__title">Coming soon</h1>
    <p class="soon__text">Quiz mode is still being built. Practice with Agile mode in the meantime.</p>
  </main>

  <script>
    (function () {
      var loader = document.getElementById('agile-home-page-loader');
      // Let the rabbit pop up once, then reveal the page
      window.addEventListener('load', function () {
        setTimeout(function () { loader.classList.add('is-hidden'); }, 900);
      });

      var switcher = document.getElementById('mode-switcher');
      document.getElementById('mode-opt-agile').addEventListener('click', function () {
        switcher.setAttribute('data-active-mode', 'agile');
        loader.classList.remove('is-hidden');
        setTimeout(function () { window.location.href = 'agile.html'; }, 450);
      });
    })();
  </script>
</body>

</html>
