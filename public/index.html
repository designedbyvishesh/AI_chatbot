<!DOCTYPE html>
<html lang="en" style="background:#000">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rabbit Quiz mode is coming soon." />
  <title>Quiz — Coming soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="agile.css" />
  <link rel="stylesheet" href="recording-timer.css" />
  <link rel="stylesheet" href="auth.css" />
  <script src="auth-boot.js"></script>
  <style>
    html, body { background: #000 !important; }
    body { margin: 0; }

    /* Same frame as the Agile home: 12px gutter, 16px radius. The rabbit
       sits on the top edge of the picture card. */
    .soon-main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px 12px;
      box-sizing: border-box;
      background: #000;
    }
    .soon-bunny {
      width: 96px;
      height: 80px;
      overflow: hidden;
      flex-shrink: 0;
      margin-bottom: -1px;
    }
    .soon-bunny img { width: 96px; height: 96px; display: block; object-fit: contain; }
    .soon-card {
      position: relative;
      flex: 1;
      min-height: 0;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #191919 url('assets/art/boat-in-the-clouds.jpg') center bottom / cover no-repeat;
    }
    .soon-card__title {
      position: absolute;
      top: 28px;
      left: 0;
      right: 0;
      text-align: center;
      margin: 0;
      font-family: 'DM Serif Text', Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -0.3px;
      color: #fff;
      text-shadow: 0 2px 16px rgba(20, 50, 90, 0.35);
    }
    @media (max-width: 700px) { .soon-card { background-position: 22% bottom; } }
    @media (prefers-reduced-motion: reduce) { .soon-bunny img { animation: none; } }
  </style>
</head>

<body>
  <!-- Same popping-rabbit loader as Agile mode, so switching never shows a blank screen -->
  <div id="agile-home-page-loader" class="agile-home-loader">
    <div class="agile-bunny-loader agile-bunny-loader--lg">
      <img src="assets/hidden_Bunny_SVG.svg" class="agile-bunny-loader__img" alt="Loading..." />
    </div>
  </div>

  <div class="app-shell" id="app-shell">
    <header class="topbar" id="topbar">
      <div class="topbar__left">
        <div class="topbar__logo" id="logo" title="I'm your bunny">
          <img src="assets/Logo_Black_BG.svg" alt="Logo" class="topbar__logo-img topbar__logo-img--dark" width="32" height="32" />
          <img src="assets/Logo_White_BG.svg" alt="Logo" class="topbar__logo-img topbar__logo-img--light" width="32" height="32" />
        </div>
        <div class="mode-switcher" id="mode-switcher" data-active-mode="quiz" title="Switch between Quiz & Agile modes">
          <div class="mode-switcher__slider"></div>
          <button class="mode-switcher__item mode-switcher__item--quiz" id="mode-opt-quiz" data-mode="quiz" aria-label="Quiz mode">
            <span class="mode-switcher__item-icon"><span class="material-symbols-outlined">quiz</span></span>
            <span class="mode-switcher__item-text">Quiz</span>
          </button>
          <button class="mode-switcher__item mode-switcher__item--agile" id="mode-opt-agile" data-mode="agile" aria-label="Switch to Agile mode">
            <span class="mode-switcher__item-icon"><span class="material-symbols-outlined">bolt</span></span>
            <span class="mode-switcher__item-text">Agile</span>
          </button>
        </div>
      </div>
      <div class="topbar__right">
        <span class="topbar__time" id="current-time">07:00 AM</span>
        <button class="topbar__icon-btn" id="more-btn" aria-label="More options" title="Page Options">
          <span class="material-symbols-outlined">more_horiz</span>
        </button>
      </div>
    </header>

    <main class="soon-main">
      <div class="soon-bunny"><img src="assets/Bunny_Blink_animation.svg" alt="" /></div>
      <section class="soon-card" role="img" aria-label="A small boat drifting on a sea of clouds at sunset">
        <h1 class="soon-card__title">Coming soon</h1>
      </section>
    </main>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('agile-home-page-loader');
      // Let the rabbit pop up once, then reveal the page
      window.addEventListener('load', function () {
        setTimeout(function () { loader.classList.add('is-hidden'); }, 900);
      });

      var timeEl = document.getElementById('current-time');
      function tick() {
        var n = new Date(), h = n.getHours(), m = String(n.getMinutes()).padStart(2, '0');
        var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
        timeEl.textContent = String(h).padStart(2, '0') + ':' + m + ' ' + ap;
      }
      tick(); setInterval(tick, 30000);

      var switcher = document.getElementById('mode-switcher');
      document.getElementById('mode-opt-agile').addEventListener('click', function () {
        switcher.setAttribute('data-active-mode', 'agile');
        loader.classList.remove('is-hidden');
        setTimeout(function () { window.location.href = 'agile.html'; }, 450);
      });
    })();
  </script>
  <script type="module" src="auth-guard.js"></script>
</body>

</html>
